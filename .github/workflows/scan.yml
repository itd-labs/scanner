name: Scan frontend build

on:
  schedule:
    - cron: "17 */2 * * *"
      timezone: "Europe/Moscow"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: itd-frontend-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out scanner
        uses: actions/checkout@v7
        with:
          path: scanner
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: scanner/package-lock.json

      - name: Install locked dependencies
        working-directory: scanner
        run: npm ci

      - name: Build and test scanner
        working-directory: scanner
        run: |
          npm run build
          npm test

      - name: Prepare snapshots worktree
        shell: bash
        run: |
          if git -C scanner fetch origin snapshots:refs/remotes/origin/snapshots; then
            git -C scanner worktree add --force -B snapshots ../snapshot-state origin/snapshots
          else
            git -C scanner worktree add --detach ../snapshot-state
            git -C snapshot-state switch --orphan snapshots
          fi
          cp scanner/.gitattributes snapshot-state/.gitattributes

      - name: Scan site
        working-directory: scanner
        run: >-
          node dist/cli.js scan
          --config itd-scanner.config.json
          --output ../snapshot-state/snapshot

      - name: Push snapshot when changed
        id: snapshot
        shell: bash
        working-directory: snapshot-state
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "The deployed build is unchanged."
            # A rerun can finish publishing the snapshot pushed by its earlier attempt.
            if [[ "$(git log -1 --format='%(trailers:key=Snapshot-Run,valueonly)')" != "$GITHUB_RUN_ID" ]]; then
              exit 0
            fi
          else
            fingerprint="$(node -p "require('./snapshot/manifest.json').buildFingerprint.slice(0, 12)")"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "snapshot: ${fingerprint}" --trailer "Snapshot-Run: $GITHUB_RUN_ID"
            git push origin HEAD:snapshots
          fi

          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish snapshot release
        if: steps.snapshot.outputs.commit != ''
        shell: bash
        working-directory: snapshot-state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SNAPSHOT_COMMIT: ${{ steps.snapshot.outputs.commit }}
        run: |
          timestamp="$(git show -s --format=%ct "$SNAPSHOT_COMMIT")"
          stamp="$(date -u -d "@$timestamp" '+%Y%m%dT%H%M%SZ')"
          title="$(date -u -d "@$timestamp" '+%Y-%m-%d %H:%M:%S UTC')"
          tag="snapshot-${stamp}-${SNAPSHOT_COMMIT:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          git push origin "$SNAPSHOT_COMMIT:refs/tags/$tag"
          gh release create "$tag" --verify-tag \
            --title "Snapshot $title" --notes-file snapshot/reports/summary.md
